name: Book Platform CI/CD & Serverless Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  BACKEND_DIR: './library'
  FRONTEND_DIR: './book-platform-ui'

jobs:
  # =========================================================================
  # JOB 1: Spring Boot Backend CI - JUnit Execution & Maven Packaging
  # =========================================================================
  backend-test-and-package:
    name: Backend JUnit Tests & Maven Package
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: book_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Automated JUnit Tests
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/book_platform?createDatabaseIfNotExist=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password
        run: mvn clean test

      - name: Package Spring Boot Application JAR with Maven
        working-directory: ${{ env.BACKEND_DIR }}
        run: mvn package -DskipTests

      - name: Upload Packaged Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: ${{ env.BACKEND_DIR }}/target/*.jar

  # =========================================================================
  # JOB 2: Angular Frontend CI & Headless Chrome UI Testing
  # =========================================================================
  frontend-build-and-ui-test:
    name: Angular Build & Selenium/Headless UI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install Angular Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build Production Angular Bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build -- --configuration production

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: ${{ env.FRONTEND_DIR }}/dist/

  # =========================================================================
  # JOB 3: Infrastructure-as-Code (IaC) Container Build & Serverless Deploy
  # =========================================================================
  serverless-container-deploy:
    name: Build Container & Deploy to Serverless Environment
    runs-on: ubuntu-latest
    needs: [backend-test-and-package, frontend-build-and-ui-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Serverless Backend Container Image
        working-directory: ${{ env.BACKEND_DIR }}
        run: docker build -t book-platform-backend:latest .

      - name: Trigger Render Serverless Container Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Triggered serverless deployment on Render."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured; skipping webhook trigger."
          fi
