services:
  # Serverless Spring Boot Backend Container
  - type: web
    name: book-platform-backend
    runtime: docker
    rootDir: library
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.MySQLDialect

  # Static Site for Angular UI
  - type: web
    name: book-platform-ui
    runtime: static
    rootDir: book-platform-ui
    buildCommand: npm install --legacy-peer-deps && npx ng build --configuration development
    staticPublishPath: ./dist/book-platform-ui/browser
    envVars:
      - key: NODE_VERSION
        value: 22
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
