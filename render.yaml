services:
  # Serverless Spring Boot Backend Container
  - type: web
    name: book-platform-backend
    runtime: docker
    rootDir: library
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # Static Site for Angular UI
  - type: web
    name: book-platform-ui
    runtime: static
    rootDir: book-platform-ui
    buildCommand: npm install && npm run build -- --configuration production
    staticPublishPath: ./dist/book-platform-ui/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
